name: debian-package

# The Debian 13 source/binary build of packaging/debian (the RFS
# package): the trixie container carries the OpenSSL 3.5 the QUIC
# layer requires, so the runner stays vanilla ubuntu-latest.

on:
  push:
    branches:
      - main
      - "pkg/**"
    paths:
      - "packaging/**"
      - "src/**"
      - "app/**"
      - "man/**"
      - ".github/workflows/debian-package.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: install the build and lintian toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper cmake ninja-build libssl-dev zlib1g-dev libzstd-dev liblz4-dev pkg-config fakeroot lintian git ca-certificates dpkg-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: assemble the quilt source tree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          V="$(dpkg-parsechangelog -S Version -lpackaging/debian/changelog)"
          UPV="${V%%-*}"
          echo "PKGVER=$V" >> "$GITHUB_ENV"
          echo "PKGUPV=$UPV" >> "$GITHUB_ENV"
          # the orig carries the UPSTREAM version (no debian revision):
          # dpkg-source looks for ../ssh3-c_<upstream>.orig.tar.gz
          git archive --format=tar.gz --prefix="ssh3-c-$UPV/" HEAD > "/tmp/ssh3-c_${UPV}.orig.tar.gz"
          mkdir -p /build
          tar -xzf "/tmp/ssh3-c_${UPV}.orig.tar.gz" -C /build
          cp -r "$GITHUB_WORKSPACE/packaging/debian" "/build/ssh3-c-$UPV/debian"

      - name: dpkg-buildpackage (source first, then binary)
        run: |
          V="$PKGVER"
          UPV="$PKGUPV"
          cp "/tmp/ssh3-c_${UPV}.orig.tar.gz" "/build/ssh3-c_${UPV}.orig.tar.gz"
          cd "/build/ssh3-c-$UPV"
          dpkg-buildpackage -us -uc -S
          dpkg-buildpackage -us -uc -b
          cp "/tmp/ssh3-c_${UPV}.orig.tar.gz" "/build/ssh3-c_${UPV}.orig.tar.gz"
          ls -la /build/*.deb /build/*.dsc /build/*.changes /build/*.orig.tar.gz

      - name: lintian (errors are fatal)
        run: |
          V="$PKGVER"
          cd /build
          lintian --fail-on error "ssh3-server_${V}_amd64.deb"
          lintian --fail-on error "ssh3-c_${V}_amd64.changes"
          lintian --fail-on error "ssh3-c_${V}_source.changes"
          echo "=== lintian info on the binary changes ==="
          lintian --info "ssh3-c_${V}_amd64.changes" || true

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: |
            /build/*.deb
            /build/*.dsc
            /build/*.changes
            /build/*.debian.tar.xz
            /build/*.orig.tar.gz
          if-no-files-found: error
