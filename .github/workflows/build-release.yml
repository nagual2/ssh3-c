# Build and release ssh3-c via GitHub Actions.
#
# Triggers:
#   - push of a v* tag: full matrix + GitHub Release with the assets
#   - workflow_dispatch: build matrix only (no release), for testing
#
# Both jobs run on Linux runners (the Windows client is a mingw-w64
# cross build, the preset windows-core): Linux minutes are the 1x
# billed kind on a private repo.  The QUIC TLS API needs OpenSSL 3.5+,
# which the runners do not ship -- each job builds its own OpenSSL
# (native / mingw64 cross) into ~/opt, cached across runs.
#
# Single source of truth of the version: src/ssh3/s3_ssh3_version.h.
# The release assets carry it; a tag must match the binary version
# (checked in the linux job) and the deb control file (checked by
# packaging/build.sh itself).

name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux-release:
    name: linux (server, deb/rpm/apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf rpm

      - name: Cache OpenSSL 3.5.9 (native)
        id: openssl
        uses: actions/cache@v4
        with:
          path: ~/opt/openssl-3.5
          key: openssl-3.5.9-linux-x86_64

      - name: Build OpenSSL 3.5.9 (native)
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 2 -o /tmp/openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          tar -C /tmp -xzf /tmp/openssl.tar.gz
          cd /tmp/openssl-3.5.9
          ./Configure --prefix="$HOME/opt/openssl-3.5" --openssldir="$HOME/opt/openssl-3.5/ssl"
          make -j"$(nproc)"
          make install_sw

      - name: Build and test (linux-release)
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          ctest --preset linux-release

      - name: Check the tag matches the binary version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(build/linux-release/ssh3-server -V | awk '{print $3}')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match the binary version $VER"
            exit 1
          fi

      - name: Package (deb/rpm/apk)
        run: bash packaging/build.sh all

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp packaging/_build/*.deb packaging/_build/*.rpm packaging/_build/*.apk dist/
          cp build/linux-release/ssh3-server dist/ssh3-server_linux_amd64
          cp build/linux-release/ssh3 dist/ssh3_linux_amd64
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/

  linux-arm64-release:
    name: linux-arm64 (server, deb/rpm/apk)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf rpm

      - name: Cache OpenSSL 3.5.9 (native arm64)
        id: openssl
        uses: actions/cache@v4
        with:
          path: ~/opt/openssl-3.5
          key: openssl-3.5.9-linux-aarch64

      - name: Build OpenSSL 3.5.9 (native arm64)
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 2 -o /tmp/openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          tar -C /tmp -xzf /tmp/openssl.tar.gz
          cd /tmp/openssl-3.5.9
          ./Configure --prefix="$HOME/opt/openssl-3.5" --openssldir="$HOME/opt/openssl-3.5/ssl"
          make -j"$(nproc)"
          make install_sw

      - name: Build and test (linux-release, arm64)
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          ctest --preset linux-release

      - name: Stage the binaries for the arm64 packaging
        run: |
          # the ARCH=arm64 channel of build.sh reads build/linux-arm64;
          # on the native arm runner the build is the plain release
          # preset (the cross toolchain preset of the preset file does
          # not apply)
          mkdir -p build/linux-arm64
          cp build/linux-release/ssh3-server build/linux-release/ssh3 build/linux-arm64/

      - name: Check the tag matches the binary version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(build/linux-release/ssh3-server -V | awk '{print $3}')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match the binary version $VER"
            exit 1
          fi

      - name: Package (deb/rpm/apk, arm64)
        run: ARCH=arm64 bash packaging/build.sh all

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp packaging/_build/*arm64.deb packaging/_build/*aarch64.rpm packaging/_build/*aarch64.apk dist/
          cp build/linux-release/ssh3-server dist/ssh3-server_linux_arm64
          cp build/linux-release/ssh3 dist/ssh3_linux_arm64
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-dist
          path: dist/

  alpine-apk:
    name: alpine (musl apk)
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.22
    steps:
      - name: Install the runner and build dependencies
        run: |
          apk add --no-cache nodejs git bash build-base cmake ninja musl-dev \
            linux-headers zlib-dev zstd-dev lz4-dev openssl-dev perl pkgconf

      - uses: actions/checkout@v4

      - name: Build and test (musl)
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          ctest --preset linux-release

      - name: Package (apk, musl)
        run: |
          # the build.sh apk channel assembles the APKv2 streams around
          # the build-tree binaries - here they are the musl ones, so
          # the so: depends of .PKGINFO resolve in a plain container
          bash packaging/build.sh apk

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp packaging/_build/*.apk dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: alpine-dist
          path: dist/

  openwrt-ipk:
    name: openwrt (ipk, SDK 25.12.6)
    runs-on: ubuntu-24.04
    # the SDK source-download machinery quirk (the git clone into
    # tmp/dl lands empty, the unpack takes the true shortcut) is under
    # investigation - the job stays non-gating and iterative
    continue-on-error: true
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file curl zstd

      - name: Cache the SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/openwrt-sdk
          key: openwrt-sdk-25.12.6-mediatek-filogic

      - name: Download the SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 2 -o /tmp/sdk.tar.zst \
            https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mkdir -p ~/openwrt-sdk/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C ~/openwrt-sdk/sdk --strip-components=1

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Stage the package feed and build the ipk
        run: |
          cp -r src/packaging/openwrt ~/openwrt-sdk/sdk/package/ssh3-server
          cd ~/openwrt-sdk/sdk
          make defconfig >/dev/null 2>&1
          make package/ssh3-server/compile V=s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          find ~/openwrt-sdk/sdk/bin/packages -name 'ssh3-server*.ipk' -exec cp -v {} dist/ \;
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-dist
          path: dist/

  windows-client:
    name: windows (client exe, mingw cross)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mingw-w64

      - name: Cache OpenSSL 3.5.9 (mingw64 cross)
        id: openssl
        uses: actions/cache@v4
        with:
          path: ~/opt/openssl-3.5-mingw
          key: openssl-3.5.9-mingw64-x86_64

      - name: Cross-build OpenSSL 3.5.9 (mingw64)
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 2 -o /tmp/openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          tar -C /tmp -xzf /tmp/openssl.tar.gz
          cd /tmp/openssl-3.5.9
          ./Configure mingw64 --cross-compile-prefix=x86_64-w64-mingw32- \
            --prefix="$HOME/opt/openssl-3.5-mingw" no-tests
          make -j"$(nproc)"
          make install_sw

      - name: Build ssh3.exe (windows-core)
        run: |
          cmake --preset windows-core
          cmake --build --preset windows-core

      - name: Verify the icon + version resource is linked
        run: |
          x86_64-w64-mingw32-objdump -h build/windows-core/ssh3.exe | grep -i '\.rsrc'
          x86_64-w64-mingw32-objdump -p build/windows-core/ssh3.exe | grep -m1 '0\.2\.0' || true

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/windows-core/ssh3.exe dist/ssh3_windows_amd64.exe
          # the cross build links the openssl import libs: the exe needs
          # the two dlls alongside (the dev tree ships them the same way)
          find "$HOME/opt/openssl-3.5-mingw" \
            \( -name 'libssl-3-x64.dll' -o -name 'libcrypto-3-x64.dll' \) \
            -exec cp -v {} dist/ \;
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/

  release:
    name: publish GitHub Release
    needs: [linux-release, linux-arm64-release, alpine-apk, windows-client]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The checksums of the assets
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/ssh3-server_linux_amd64
            dist/ssh3_linux_amd64
            dist/ssh3-server_linux_arm64
            dist/ssh3_linux_arm64
            dist/ssh3_windows_amd64.exe
            dist/libssl-3-x64.dll
            dist/libcrypto-3-x64.dll
            dist/checksums.txt
          body: |
            ssh3-c ${{ github.ref_name }}

            - `ssh3-server`: deb / rpm / apk packages (amd64 + arm64); the deb
              bundles OpenSSL 3.5 for OpenSSL 3.0.x targets (mint 22.x,
              ubuntu 24.04); the apk is the musl build (alpine 3.22)
            - `ssh3-server_linux_amd64` / `ssh3-server_linux_arm64`: raw
              server binaries
            - `ssh3_linux_amd64` / `ssh3_linux_arm64`: raw client binaries
            - `checksums.txt`: the sha256 of every asset of the release
            - `ssh3_windows_amd64.exe`: the Windows client, icon and version
              resources embedded; needs `libssl-3-x64.dll` / `libcrypto-3-x64.dll`
              from this release next to it (or in PATH)
          generate_release_notes: true
